[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scm-mcp"
version = "0.1.0"
description = "MCP server wrapping Palo Alto Networks Strata Cloud Manager (SCM) REST API (stdio)."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
scm-mcp = "scm_mcp.server:main"
scm-mcp-check = "scm_mcp.check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: 需要可访问 SCM API 的连通性测试（默认跳过）",
]
